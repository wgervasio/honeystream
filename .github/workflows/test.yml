name: Test

on:
  push:
    paths:
    - 'AGENTS.md'
    - '.github/agents/**'
    - '.github/copilot-instructions.md'
    - '.github/workflows/**'
    - 'docs/**'
    - 'scripts/**'
    - 'package.json'
    - 'packages/honeystream-app/**'
    - 'packages/honeystream-signal-server/**'
    - 'packages/honeystream-remote-extension/**'
  pull_request:
    paths:
    - 'AGENTS.md'
    - '.github/agents/**'
    - '.github/copilot-instructions.md'
    - '.github/workflows/**'
    - 'docs/**'
    - 'scripts/**'
    - 'package.json'
    - 'packages/honeystream-app/**'
    - 'packages/honeystream-signal-server/**'
    - 'packages/honeystream-remote-extension/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v2

    - name: Setup Node
      uses: actions/setup-node@v1
      with:
        node-version: '12.x'

    - name: Install dependencies
      run: |
        yarn install

    - name: Run architecture analyzer
      run: |
        npm run analyze:architecture

    - name: Build signal server
      working-directory: ./packages/honeystream-signal-server
      run: |
        yarn build

    - name: Run unit tests
      working-directory: ./packages/honeystream-app
      run: |
        yarn test:unit

    - name: Archive screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: packages/honeystream-app/test/artifacts/*.jpg
