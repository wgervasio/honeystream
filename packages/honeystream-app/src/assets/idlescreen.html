<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Honeystream Idlescreen</title>
    <link rel="icon" type="image/png" href="/images/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/images/icon-512.png" sizes="512x512" />
    <link rel="stylesheet" href="../../styles/app.global.css" />
    <style>
      html,
      body {
        background: transparent;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', 'Ubuntu',
          'Droid Sans', sans-serif;
        color: rgba(255, 255, 255, 0.8);
      }

      #popup {
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100%;
        height: 100%;
        padding: 32px;
        box-sizing: border-box;
        background: radial-gradient(circle at 18% 16%, rgba(158, 215, 255, 0.25), transparent 30%),
          radial-gradient(circle at 84% 78%, rgba(247, 215, 232, 0.24), transparent 34%),
          var(--app-bg-lobby);
        font-size: 1.25rem;
        line-height: 1.45em;
      }

      .card {
        max-width: 620px;
        padding: 34px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.13);
        box-shadow: 0 24px 80px rgba(36, 28, 53, 0.28);
        backdrop-filter: blur(24px);
      }

      .kicker {
        margin: 0 0 10px;
        color: #ffd88a;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: white;
        font-size: 3rem;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
      }

      .pills {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .pills span {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        font-size: 0.85rem;
      }
    </style>
  </head>

  <body>
    <div id="popup" style="display:none">
      <section class="card">
        <p class="kicker">Cozy room is empty</p>
        <h1>Add the first watch.</h1>
        <p>Open the media picker to add a local file, website video, or direct media URL.</p>
        <div class="pills" aria-hidden="true">
          <span>Cat-side queue</span>
          <span>Rabbit-side sync</span>
          <span>One private invite</span>
        </div>
      </section>
    </div>

    <script>
      ;(function() {
        const isTopFrame = window.top === window.self
        if (isTopFrame) {
          document.getElementById('popup').style.display = null
        }
      })()
    </script>
  </body>
</html>
